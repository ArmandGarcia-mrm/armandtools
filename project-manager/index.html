
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JiraSync Project Manager</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        /* Fallback UI while React loads */
        #root:empty::before {
            content: 'Initializing JiraSync Pro...';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #64748b;
            font-weight: 500;
            background-color: #f8fafc;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@0.2.1",
    "recharts": "https://esm.sh/recharts@2.15.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- 
      IMPORTANT FOR GITHUB PAGES:
      Standard browsers cannot run .tsx files.
      If you see "MIME type" errors in your console on GitHub Pages, 
      it is because you are trying to run raw TypeScript in a browser.
      
      TO DEPLOY TO GITHUB:
      1. Use a tool like Vite (https://vitejs.dev/guide/)
      2. Run 'npm run build'
      3. Upload the 'dist' folder contents to your repository.
    -->
    <script type="module" src="./index.tsx"></script>
    <script>
      // Diagnostic helper for GitHub Pages
      if (window.location.hostname.includes('github.io') && !window.location.pathname.endsWith('/')) {
        console.warn("JiraSync: You might be missing a trailing slash in your URL. Try adding / at the end of the address bar.");
      }
    </script>
</body>
</html>
